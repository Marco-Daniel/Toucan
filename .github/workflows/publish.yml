# Puts a published GitHub release's VSIX on the VS Code Marketplace: exactly
# the file that was released, checked first, never rebuilt. It signs in to
# Entra ID as a managed identity through OIDC: no secret exists. The
# `marketplace` environment only admits v* tags, which only Marco can create.
name: Publish to the Marketplace

on:
  release:
    types: [published]

permissions: {}

jobs:
  # Checks the release's VSIX and prepares vsce, with no way to mint an OIDC
  # token. It hands both on, each with its SHA-256.
  verify:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    outputs:
      vsix-sha256: ${{ steps.vsix.outputs.sha256 }}
      vsce-sha256: ${{ steps.vsce.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the release's VSIX
        run: |
          set -euo pipefail
          vsix="toucan-${TAG#v}.vsix"
          gh release download "$TAG" --pattern "$vsix" --dir "$RUNNER_TEMP/publish"
          echo "VSIX=$RUNNER_TEMP/publish/$vsix" >> "$GITHUB_ENV"
      - name: Check it's the released asset
        run: gh release verify-asset "$TAG" "$VSIX"
      - id: vsix
        name: Check its SHA-256 against the release notes
        run: |
          set -euo pipefail
          sha256=$(sha256sum "$VSIX" | cut -d ' ' -f 1)
          if ! gh release view "$TAG" --json body --jq .body | grep -qF "SHA-256: \`$sha256\`"; then
            echo "The release notes don't name SHA-256 $sha256" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Check package.yml built it from main
        run: >-
          gh attestation verify "$VSIX"
          --repo Marco-Daniel/Toucan
          --signer-workflow Marco-Daniel/Toucan/.github/workflows/package.yml
          --source-ref refs/heads/main
          --deny-self-hosted-runners
      # vsce exactly as locked, install scripts off, copied out of pnpm's
      # symlinked store into one tarball the publish job can run from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: what publishes is installed from the lockfile alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter toucan --ignore-scripts
      - id: vsce
        name: Pack vsce
        run: |
          set -euo pipefail
          pnpm --filter toucan deploy --prod=false --ignore-scripts "$RUNNER_TEMP/vsce"
          node "$RUNNER_TEMP/vsce/node_modules/@vscode/vsce/vsce" --version
          tar -czf "$RUNNER_TEMP/publish/vsce.tgz" -C "$RUNNER_TEMP" vsce
          echo "sha256=$(sha256sum "$RUNNER_TEMP/publish/vsce.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish
          path: ${{ runner.temp }}/publish/
          if-no-files-found: error

  # Can mint an OIDC token for the whole job, so it runs no repo or dependency
  # code before vsce: no checkout, no install, only pinned actions and the
  # two files verify handed over, each checked by its SHA-256.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      VSIX_SHA256: ${{ needs.verify.outputs.vsix-sha256 }}
      VSCE_SHA256: ${{ needs.verify.outputs.vsce-sha256 }}
    steps:
      # The repo's .nvmrc version; this job has no checkout to read it from.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish
          path: ${{ runner.temp }}/publish
      - name: Check both files are the ones verify checked, and unpack vsce
        working-directory: ${{ runner.temp }}/publish
        run: |
          set -euo pipefail
          vsix="toucan-${TAG#v}.vsix"
          printf '%s  %s\n%s  %s\n' "$VSIX_SHA256" "$vsix" "$VSCE_SHA256" vsce.tgz |
            sha256sum --check --strict
          tar -xzf vsce.tgz -C "$RUNNER_TEMP"
          echo "VSIX=$RUNNER_TEMP/publish/$vsix" >> "$GITHUB_ENV"
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # vsce finds the az session azure/login left (AzureCliCredential).
      - name: Publish to the Marketplace
        run: >-
          node "$RUNNER_TEMP/vsce/node_modules/@vscode/vsce/vsce" publish
          --azure-credential --packagePath "$VSIX" --skip-duplicate
