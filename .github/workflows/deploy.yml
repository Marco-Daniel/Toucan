name: Deploy site

# Production deploys of apps/site to Netlify, from main only (website/0010):
# after a push to main that touches the site or what it's built from, or by
# hand from main (after a release, to refresh the changelog). Never on pull
# requests.
#
# Two jobs, so the token never meets the dependencies: `build` installs and
# builds with no environment and no secrets, and hands over build/client as an
# artifact. `deploy` holds the token (the `production` environment, which only
# main may use) and runs nothing but scripts/deploy.mts from a fresh sparse
# checkout, with plain Node: no pnpm, no install, no cache.
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/brand/**
      - apps/extension/media/**
      - apps/extension/src/shared/**
      - config/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling one mid-upload.
concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a deploy builds from the lockfile alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # The same gates as CI for the site and the packages it's built from.
      - name: Check the site
        run: pnpm turbo run lint typecheck test check:generated --filter=@toucan/site...
      # The changelog reads the GitHub releases with the workflow's read-only token.
      - name: Build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm turbo run build check:pages --filter=@toucan/site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: apps/site/build/client
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .nvmrc
            apps/site/scripts/deploy.mts
            apps/site/scripts/netlify.mts
            apps/extension/package.json
            apps/extension/src/shared/async/tryCatch.util.ts
            apps/extension/src/shared/records/records.util.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: apps/site/build/client
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: node apps/site/scripts/deploy.mts
