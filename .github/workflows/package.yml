# Builds a release from main: the VSIX, attested, with its CHANGELOG.md, and a
# draft GitHub release with the VSIX attached and the notes from
# apps/extension/release-notes.md. Publishing that draft (as Marco) fires
# publish.yml, which puts exactly that VSIX on the Marketplace.
name: Package VSIX

on:
  workflow_dispatch:

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    # publish.yml only accepts a VSIX this workflow attested from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A normal run takes about a minute; a hang shouldn't burn GitHub's 6 h default.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release is built from the lockfile alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # The same checks as CI: a release is never built from a red tree.
      - name: Check generated files are up to date
        run: pnpm -C apps/extension check:generated
      - run: pnpm format:check
      - run: pnpm turbo run lint lint:repo typecheck typecheck:repo test test:repo
      - id: version
        name: Read the version
        run: echo "version=$(node -p 'require("./apps/extension/package.json").version')" >> "$GITHUB_OUTPUT"
      # This version's notes first, then every published release's. Fails when
      # the notes aren't this version's, or GitHub's releases can't be read.
      - name: Write CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm -C apps/extension changelog --release
      - run: pnpm -C apps/extension package
      - run: pnpm -C apps/extension check:bundle
      - run: pnpm -C apps/extension check:vsix
      # The VSIX and its filled-in notes, side by side, are the release job's input.
      - name: Stage the VSIX and the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          cp "apps/extension/toucan-$VERSION.vsix" "$RUNNER_TEMP/release/"
          node apps/extension/scripts/fill-release-notes.mts \
            "$RUNNER_TEMP/release/toucan-$VERSION.vsix" "$RUNNER_TEMP/release/release-notes.md"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/toucan-*.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  # Only creates the draft: no checkout, no install, no repo code.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # A draft: its tag is made only when Marco publishes it.
      - name: Create the draft release
        run: >-
          gh release create "v$VERSION"
          --draft
          --target "$GITHUB_SHA"
          --title "Toucan $VERSION"
          --notes-file release/release-notes.md
          "release/toucan-$VERSION.vsix"
