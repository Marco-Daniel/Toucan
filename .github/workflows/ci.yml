name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes about a minute; a hang shouldn't burn GitHub's 6 h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Regenerates the generated files and fails on any change, including new
      # untracked files. package.yml runs the same script.
      - name: Check generated files are up to date
        run: pnpm -C apps/extension check:generated
      - run: pnpm format:check
      # Every package's gates and the root's own tooling, in dependency order.
      # The site's changelog reads the GitHub releases with the workflow's token.
      - name: Lint, typecheck, test, build and check the bundle, VSIX and site pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm turbo run lint lint:repo typecheck typecheck:repo test test:repo build
          check:bundle check:vsix check:pages
