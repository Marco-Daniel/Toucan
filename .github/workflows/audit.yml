name: Audit

# GitHub's dependency graph can't read this pnpm lockfile, so Dependabot never
# alerts on the npm packages. This checks them against the npm advisory
# database instead, weekly and on demand.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Both steps read only the lockfile: nothing is installed, so no
      # dependency code runs. This one names every advisory, of any severity,
      # in the log; it never fails the run.
      - name: List all advisories
        run: pnpm audit || true
      # This one fails the run on high or critical advisories only. With a
      # level set, pnpm prints just the counts, hence the step above.
      - name: Fail on high or critical advisories
        run: pnpm audit --audit-level high
