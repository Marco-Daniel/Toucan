packages:
  - apps/*
  - config/*
  - packages/*

# One version of each tool shared by several packages.
catalog:
  "@resvg/resvg-js": ^2.6.2
  "@types/node": ^22.20.5
  "@types/pngjs": 6.0.5
  oxlint: ^1.86.0
  oxlint-tsgolint: 7.0.2005
  pngjs: 7.0.0
  typescript: ^7.0.2
  vitest: ^5.0.3

# Floors for transitive dependencies with published advisories, so the weekly
# audit stays green. Each range selects only the vulnerable versions; drop the
# entry once nothing in the tree resolves below the patched release.
overrides:
  "fast-uri@<3.1.9": ^3.1.9
  "qs@<6.16.1": ^6.16.1
  "source-map-js@<1.2.2": ^1.2.2
  "zod@<4.6.6": ^4.6.6

allowBuilds:
  "@vscode/vsce-sign": false
  esbuild: false

# Supply-chain checks. pnpm applies them on every install, including CI's
# frozen one, and fails if a lockfile entry breaks them.
# Install no version younger than a day, so a compromised release has time to
# be caught first (pnpm's default, stated here so it stays on).
minimumReleaseAge: 1440
# Only direct dependencies may come from git or a tarball URL (pnpm's default,
# stated here too).
blockExoticSubdeps: true
# Refuse a version published with less trust than an earlier one (say, without
# the provenance its predecessors had): the mark of a hijacked package.
trustPolicy: no-downgrade
# Old releases from before these packages adopted trusted publishing, which
# the check reads as a downgrade. Pinned by version, so a new release is still
# checked.
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
